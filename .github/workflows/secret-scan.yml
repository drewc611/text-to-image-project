name: Secret scan

# Two nets. Gitleaks finds real credentials (in the diff and across history);
# the placeholder check finds the "change-me" values and secret defaults that
# gitleaks' entropy rules do not consider secrets but that ship auth-bypasses.
# Actions are pinned to a commit SHA so a moved tag cannot change what runs.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly full-history sweep, Monday 06:17 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # the action lists the PR's commits to scope its scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # An org-owned repo needs GITLEAKS_LICENSE (free for personal repos).

  placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Placeholder credentials, secret defaults, debug servers
        run: bash scripts/check-placeholder-secrets.sh
